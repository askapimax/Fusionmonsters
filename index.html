<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fusionmonsters</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #101018;
        overflow: hidden;
      }

      #game-root {
        display: flex;
        flex-direction: column;
        /* Mobile browsers (esp. Chrome/Android) collapse/expand their
           address bar as you scroll, and 100vh measures the viewport as if
           that bar were never there - so a 100vh layout runs taller than
           what's actually visible and the control bar at the bottom gets
           pushed off-screen. --app-height (set from JS below, from the
           real window.innerHeight) is the reliable fix; 100dvh is a CSS-only
           fallback for the instant before that script runs. */
        height: var(--app-height, 100dvh);
        width: 100vw;
      }

      #app {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        justify-content: center;
        /* Top-align rather than center: on tall/narrow screens FIT leaves
           extra vertical space, and top-aligning keeps that gap next to
           the control bar below instead of splitting it above and below
           the game view. */
        align-items: flex-start;
        overflow: hidden;
      }

      /* Movement controls: always rendered (useful on desktop too, not just
         touch devices - clicking works exactly like tapping). Grid keeps
         the D-pad visually centered while the Start button sits in its own
         column to the right, instead of the two fighting over flexbox
         centering. */
      #touch-controls {
        flex: 0 0 auto;
        height: 168px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        background: #0a0a12;
        border-top: 1px solid #23232e;
        touch-action: none;
        user-select: none;
      }

      .dpad {
        grid-column: 2;
        position: relative;
        width: 156px;
        height: 156px;
      }

      /* Right-hand side of the control bar: A/B action buttons stacked
         above the Start button, Game Boy-style (B on the left, A on the
         right). */
      .side-controls {
        grid-column: 3;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .action-btns {
        display: flex;
        gap: 10px;
      }

      .action-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #2a2a35;
        color: #e8e8f0;
        border: 2px solid #454555;
        font-size: 16px;
        font-weight: bold;
        font-family: monospace;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .action-btn:active,
      .action-btn.is-pressed {
        background: #3f7f6b;
        border-color: #5fa38c;
      }

      /* Game Boy-style Start button: small dark pill. */
      .start-btn-wrap {
        justify-self: start;
      }

      .start-btn {
        width: 76px;
        height: 28px;
        border-radius: 14px;
        background: #2a2a35;
        color: #e8e8f0;
        border: 2px solid #454555;
        font-size: 11px;
        font-family: monospace;
        letter-spacing: 1px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .start-btn:active,
      .start-btn.is-pressed {
        background: #3f7f6b;
        border-color: #5fa38c;
      }

      .dpad-btn {
        position: absolute;
        width: 52px;
        height: 52px;
        background: #2a2a35;
        color: #e8e8f0;
        border: 2px solid #454555;
        border-radius: 10px;
        font-size: 20px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .dpad-btn:active,
      .dpad-btn.is-pressed {
        background: #3f7f6b;
        border-color: #5fa38c;
      }

      .dpad-up { top: 0; left: 52px; }
      .dpad-down { top: 104px; left: 52px; }
      .dpad-left { top: 52px; left: 0; }
      .dpad-right { top: 52px; left: 104px; }
    </style>
    <script>
      // Real fix for the 100vh/100dvh mobile-toolbar issue: measure the
      // actual visible viewport directly and keep it updated (Chrome fires
      // 'resize' when its address bar collapses/expands on scroll).
      function setAppHeight() {
        document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
      }
      setAppHeight();
      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', setAppHeight);
    </script>
  </head>
  <body>
    <div id="game-root">
      <div id="app"></div>
      <div id="touch-controls" aria-label="Movement controls">
        <div class="dpad">
          <button class="dpad-btn dpad-up" data-dir="up" aria-label="Move up">&#9650;</button>
          <button class="dpad-btn dpad-left" data-dir="left" aria-label="Move left">&#9664;</button>
          <button class="dpad-btn dpad-right" data-dir="right" aria-label="Move right">&#9654;</button>
          <button class="dpad-btn dpad-down" data-dir="down" aria-label="Move down">&#9660;</button>
        </div>
        <div class="side-controls">
          <div class="action-btns">
            <button id="b-btn" class="action-btn" aria-label="B button (back/cancel)">B</button>
            <button id="a-btn" class="action-btn" aria-label="A button (confirm)">A</button>
          </div>
          <div class="start-btn-wrap">
            <button id="start-btn" class="start-btn" aria-label="Open menu">START</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
