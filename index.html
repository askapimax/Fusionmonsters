<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fusionmonsters</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #101018;
        overflow: hidden;
      }

      #game-root {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
      }

      #app {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        justify-content: center;
        /* Top-align rather than center: on tall/narrow screens FIT leaves
           extra vertical space, and top-aligning keeps that gap next to
           the control bar below instead of splitting it above and below
           the game view. */
        align-items: flex-start;
        overflow: hidden;
      }

      /* Movement controls: always rendered (useful on desktop too, not just
         touch devices - clicking works exactly like tapping). */
      #touch-controls {
        flex: 0 0 auto;
        height: 168px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a12;
        border-top: 1px solid #23232e;
        touch-action: none;
        user-select: none;
      }

      .dpad {
        position: relative;
        width: 156px;
        height: 156px;
      }

      .dpad-btn {
        position: absolute;
        width: 52px;
        height: 52px;
        background: #2a2a35;
        color: #e8e8f0;
        border: 2px solid #454555;
        border-radius: 10px;
        font-size: 20px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .dpad-btn:active,
      .dpad-btn.is-pressed {
        background: #3f7f6b;
        border-color: #5fa38c;
      }

      .dpad-up { top: 0; left: 52px; }
      .dpad-down { top: 104px; left: 52px; }
      .dpad-left { top: 52px; left: 0; }
      .dpad-right { top: 52px; left: 104px; }
    </style>
  </head>
  <body>
    <div id="game-root">
      <div id="app"></div>
      <div id="touch-controls" aria-label="Movement controls">
        <div class="dpad">
          <button class="dpad-btn dpad-up" data-dir="up" aria-label="Move up">&#9650;</button>
          <button class="dpad-btn dpad-left" data-dir="left" aria-label="Move left">&#9664;</button>
          <button class="dpad-btn dpad-right" data-dir="right" aria-label="Move right">&#9654;</button>
          <button class="dpad-btn dpad-down" data-dir="down" aria-label="Move down">&#9660;</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
